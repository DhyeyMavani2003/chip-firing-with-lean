# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4. Replace every remaining TEMPLATE value before submitting.
# Replace a placeholder list with [] only when its adjacent comment permits it;
# lists described as required must remain nonempty.
version: "v0.4"
project:
  name: "Chip-Firing with Lean 4"
  description: >-
    TEMPLATE: concise public account of the mathematical content and principal
    results of the formalization
  # Required nonempty list of name strings or mappings with a nonempty name.
  authors:
    - "Dhyey Dharmendrakumar Mavani"
    - "Nathan Pflueger"
  # Required root licence. Keep this in sync with the Apache-2.0 LICENSE file.
  license: "Apache-2.0"
  # Required nonempty list of name strings or mappings with a nonempty name.
  # For a thin wrapper, name people responsible for this submitted wrapper;
  # submission authorization separately covers the underlying formalization.
  responsible_maintainers:
    - "Dhyey Dharmendrakumar Mavani"
    - "Nathan Pflueger"
# Omit repository for an ordinary project: Palomar treats this submitted
# repository as the substantive proof development. If this repository is only
# a thin Comparator wrapper, uncomment and pin the actual formalization in this
# exact shape:
# repository:
#   substantive_formalization:
#     id: "TEMPLATE: owner/repository or https://github.com/owner/repository"
#     revision: "TEMPLATE: full 40-character lowercase commit SHA"
classification:
  # Use 1–2 official arXiv identifiers such as math.LO and 1–8 five-character
  # MSC 2020 identifiers such as 03B35.
  arxiv: ["math.CO"]
  msc2020: ["TEMPLATE: five-character MSC 2020 identifier such as 03B35"]
sources:
  # Sources must be nonempty. Every source needs a title and relationship; the
  # relationship must be exactly formalizes, adapts, independently-proves,
  # background, or other.
  - title: "Riemann-Roch and Abel-Jacobi theory on a finite graph"
    authors:
      - "Matthew Baker"
      - "Serguei Norine"
    id: "https://doi.org/10.1016/j.aim.2007.04.012"
    type: "article"
    location: "Advances in Mathematics 215 (2007), no. 2, 766–788"
    relationship: "formalizes"
status:
  scope: >-
    TEMPLATE: state exactly what is and is not formalized, including any weaker
    theorem, changed hypotheses, or omitted material.
  # Count the proof development, excluding Challenge.lean's deliberate sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  # status.main_results is optional. Add it only when a short curated
  # project-level list is useful; it need not mirror Comparator declarations.
