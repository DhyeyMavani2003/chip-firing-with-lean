# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4. Replace every remaining TEMPLATE value before submitting.
# Replace a placeholder list with [] only when its adjacent comment permits it;
# lists described as required must remain nonempty.
version: "v0.4"
project:
  name: "Chip-Firing with Lean 4"
  description: >-
    A Lean 4 / Mathlib formalization of Baker and Norine's Riemann-Roch theorem for
    finite graphs. Chip configurations on a finite graph, modulo chip-firing moves, form
    an abelian group analogous to the group of line bundles on a compact Riemann
    surface. Each class can be assigned a rank, analogous to the dimension of a linear
    series. These ranks then satisfy a formula of the form r(D) - r(K-D) = deg D + 1 -
    g, in exact analogy to Riemann surfaces. This formula is formalzied, along with the
    analog of Clifford's theorem for finite graphs.
  # Required nonempty list of name strings or mappings with a nonempty name.
  authors:
    - "Dhyey Dharmendrakumar Mavani"
    - "Nathan Pflueger"
  # Required root licence. Keep this in sync with the Apache-2.0 LICENSE file.
  license: "Apache-2.0"
  # Required nonempty list of name strings or mappings with a nonempty name.
  # For a thin wrapper, name people responsible for this submitted wrapper;
  # submission authorization separately covers the underlying formalization.
  responsible_maintainers:
    - "Dhyey Dharmendrakumar Mavani"
    - "Nathan Pflueger"
# Omit repository for an ordinary project: Palomar treats this submitted
# repository as the substantive proof development. If this repository is only
# a thin Comparator wrapper, uncomment and pin the actual formalization in this
# exact shape:
# repository:
#   substantive_formalization:
#     id: "TEMPLATE: owner/repository or https://github.com/owner/repository"
#     revision: "TEMPLATE: full 40-character lowercase commit SHA"
classification:
  # Use 1–2 official arXiv identifiers such as math.LO and 1–8 five-character
  # MSC 2020 identifiers such as 03B35.
  arxiv: ["math.CO"]
  msc2020: ["05C57","14T20"]
sources:
  # Sources must be nonempty. Every source needs a title and relationship; the
  # relationship must be exactly formalizes, adapts, independently-proves,
  # background, or other.
  - title: "Riemann-Roch and Abel-Jacobi theory on a finite graph"
    authors:
      - "Matthew Baker"
      - "Serguei Norine"
    id: "https://doi.org/10.1016/j.aim.2007.04.012"
    type: "article"
    location: "Advances in Mathematics 215 (2007), no. 2, 766–788"
    relationship: "formalizes"
status:
  scope: >-
    The Riemann-Roch formula, Theorem 1.12 in the original paper, is formalized, along
    with Corollary 3.5 (Clifford's theorem). These statements are proved in restated
    form, using the predicate rank_eq rather than the rank function itself. The
    existence and uniqueness of the rank function is proved as a separate proposition.
    The remaining results of the paper, most notably concerning the Abel-Jacobi map and
    its implications, are not formalized here.
  # Count the proof development, excluding Challenge.lean's deliberate sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  # status.main_results is optional. Add it only when a short curated
  # project-level list is useful; it need not mirror Comparator declarations.
automation:
  methods:
    - method: "manual"
    - method: "copilot"
      models: ["not tracked"]
      framework: "n/a"
      tool_setup: "GitHub Copilot in VS Code"
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
    - method: "agent"
      models: ["not tracked"]
      framework: "n/a"
      tool_setup: "Claude Code and Codex CLI apps, used for editing"
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: "Initial development was manual with autocomplete from GitHub copilot. Agents were used in later phases, for purposes including: refactoring, simplifying and shortening proofs, debugging after version bumps, filling in some doc strings."
fidelity:
  divergences: "The Challenge represents the source's rank function with the relational
    predicate rank_eq, and therefore states Riemann--Roch and Clifford with
    explicit rank witnesses. No other mathematical divergences are known."

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "theorem statements written manually"
alignment:
  namespace: "Propositions"
  statements:
    - source: "Baker--Norine (2007), Theorem 1.12 (Riemann--Roch for Graphs)"
      lean: "Propositions.riemann_roch"
      module: "ChipFiringWithLean.Solution"
      status: "adapted"
      note: >-
        The same Riemann--Roch identity, phrased with witnesses for
        the relational predicate rank_eq instead of the paper's rank function.

    - source: "Baker--Norine (2007), Corollary 3.5 (Clifford's Theorem for Graphs)"
      lean: "Propositions.clifford"
      module: "ChipFiringWithLean.Solution"
      status: "adapted"
      note: >-
        The same Clifford bound, phrased using rank_eq witnesses and
        nonnegativity of the ranks of D and K-D.

    - source: "Baker--Norine (2007), definition of divisor rank"
      lean: "Propositions.rank_well_defined"
      module: "ChipFiringWithLean.Solution"
      status: "adapted"
      note: >-
        A formalization-specific existence-and-uniqueness result that lets the
        Challenge represent the paper's rank function by the relation rank_eq."

acknowledgements: "Mathlib"
